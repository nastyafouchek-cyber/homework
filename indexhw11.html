<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylehw11.css">
    <title>Document</title>
</head>
<body>
<div class="card-container">
    <div class="header-banner">CREDIT CARD DETAILS</div>
    
    <form>
        <div class="input-group">
            <label for="card-num">Card Number</label>
            <input type="text" id="card-num" placeholder="1234 5678 9012 3456">
        </div>

        <div class="input-group">
            <label for="name">Name On Card</label>
            <input type="text" id="name" placeholder="Name Surname">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Expire Date</label>
                <div class="expiry-inputs">
                    <input type="text" placeholder="02">
                    <input type="text" placeholder="2017">
                </div>
            </div>

            <div class="input-group csv-input">
                <label for="csv">CSV No.</label>
                <input type="password" id="csv" placeholder="***">
            </div>
        </div>
    </form>

    <div class="decoration">
        <div class="planet"></div>
    </div>
</div>
</body>
</html>
